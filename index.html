<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>贪吃蛇 · 经典街机</title>
<meta name="description" content="经典贪吃蛇，方向键或滑动控制，吃食物变长，撞墙或撞自己结束">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
<meta name="theme-color" content="#4caf50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="贪吃蛇">
<style>

:root{
  --bg:#f4f5f7;           /* 页面底色：浅灰，避免纯白刺眼 */
  --bg-glow:#ffffff;      /* 顶部径向光晕色，制造轻微的空间感 */
  --surface:#ffffff;      /* 卡片底色 */
  --surface-2:#fafbfc;    /* 卡片内的次级区块（输入框、结果区） */
  --text:#16181d;         /* 主文字 */
  --soft:#5d636e;         /* 次要文字 */
  --mute:#8b929e;         /* 弱化文字（提示、单位、占位符） */
  --line:#e6e8ec;         /* 分割线与边框 */
  --accent:#26a69a;       /* 强调色（各玩具不同） */
  --accent-soft:#e6f4f2;  /* 强调色的浅色版，用于底色块 */
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --ease:cubic-bezier(.4,0,.2,1);
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
}
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);
  /* 顶部一层极淡光晕，比死板的纯色更有层次 */
  background-image:radial-gradient(120% 80% at 50% 0%, var(--bg-glow) 0%, rgba(255,255,255,0) 62%);
  background-attachment:fixed;
  color:var(--text);
  min-height:100dvh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:24px; -webkit-font-smoothing:antialiased;
}

.app{width:100%; max-width:480px; display:flex; flex-direction:column; align-items:center; gap:20px}

.head{text-align:center}
.head h1{font-size:22px; font-weight:600; letter-spacing:.5px}
.head p{font-size:13px; color:var(--mute); margin-top:6px}

.card{
  width:100%; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-lg); padding:22px; box-shadow:var(--shadow);
}

.stage{
  width:288px; height:288px; position:relative;
  background:var(--surface); border:1px solid var(--line);
  border-radius:50%; box-shadow:var(--shadow);
  display:flex; align-items:center; justify-content:center;
}
.stage canvas{border-radius:50%}

.phase{
  font-size:29px; font-weight:300; letter-spacing:6px;
  color:var(--accent); min-height:42px; text-align:center;
  transition:color .4s var(--ease);
}
.cd{font-size:15px; color:var(--soft); font-variant-numeric:tabular-nums; min-height:22px}
.meta{font-size:13px; color:var(--mute); min-height:20px; text-align:center}

.row{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.stats{display:flex; gap:10px; width:100%}
.stat{
  flex:1; background:var(--surface-2); border:1px solid var(--line);
  border-radius:var(--r-md); padding:12px; text-align:center;
}
.stat .k{font-size:11px; color:var(--mute); letter-spacing:1px}
.stat .v{font-size:21px; font-weight:600; margin-top:3px; font-variant-numeric:tabular-nums}

.chip{
  padding:9px 18px; font-size:13px; font-weight:500; font-family:inherit;
  background:var(--surface); color:var(--soft);
  border:1px solid var(--line); border-radius:999px; cursor:pointer;
  transition:all .2s var(--ease);
}
.chip:hover{border-color:var(--accent); color:var(--accent)}
.chip.active{
  background:var(--accent); border-color:var(--accent); color:#fff;
  box-shadow:0 4px 14px rgba(0,0,0,.14);
}

.btn{
  padding:13px 42px; font-size:15px; font-weight:600; font-family:inherit;
  letter-spacing:3px; background:var(--accent); color:#fff;
  border:none; border-radius:var(--r-md); cursor:pointer;
  transition:transform .15s var(--ease), box-shadow .2s var(--ease);
  box-shadow:0 6px 20px rgba(0,0,0,.16);
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--soft); box-shadow:none}

.lang{
  position:fixed; top:16px; right:16px; z-index:20;
  padding:7px 14px; font-size:12px; font-weight:600; font-family:inherit;
  background:var(--surface); color:var(--soft);
  border:1px solid var(--line); border-radius:999px; cursor:pointer;
  transition:all .2s var(--ease);
}
.lang:hover{border-color:var(--accent); color:var(--accent)}

.hint{font-size:12px; color:var(--mute); text-align:center; line-height:1.7}

@media (max-width:380px){
  .stage{width:250px;height:250px}
  .phase{font-size:25px; letter-spacing:4px}
}

:root{ --accent:#4caf50; --accent-soft:#e9f5ea; }

canvas.board{border-radius:var(--r-md);background:#1f2937;display:block;width:100%;max-width:320px;margin:0 auto}

</style>
</head>
<body>
<button class="lang" id="langBtn" onclick="toggleLang()">EN</button>
<div class="app">

  <div class="head">
    <h1 id="t_title">贪吃蛇</h1>
    <p id="t_sub">吃得越多，长得越长</p>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><div class="k" id="t_score">分数</div><div class="v" id="vScore">0</div></div>
      <div class="stat"><div class="k" id="t_best">最高</div><div class="v" id="vBest">0</div></div>
    </div>
  </div>

  <div class="card">
    <canvas class="board" id="board" width="320" height="320"></canvas>
    <div class="row" style="margin-top:16px">
      <button class="btn" id="mainBtn" onclick="toggle()">开始</button>
      <button class="btn ghost" onclick="reset()">重置</button>
    </div>
  </div>

  <div class="hint" id="t_hint">方向键 或 WASD 控制，手机可滑动<br>撞墙或撞到自己就结束</div>

</div>
<script>

/* ============================================================
 * 贪吃蛇
 * ------------------------------------------------------------
 * 结构：
 *   - CELL 格数（20×20），每个格子 16px，画布 320×320
 *   - snake 是坐标数组，snake[0] 是蛇头
 *   - 每次 tick：根据 dir 算新头坐标 → 判断是否撞墙/撞自己
 *     → 若吃到食物则保留尾（变长），否则弹出尾（移动）
 *
 * 为什么用固定步长而不是连续动画？
 *   街机手感要求格子对齐、判定明确，插值反而会让"撞墙"判定模糊。
 * ========================================================== */

const CELL = 16;
const N = 20;                 /* 20 × 20 格 */

var board = document.getElementById('board');
var bctx = board.getContext('2d');

let snake, dir, nextDir, food, score, best, running, ticker;

function loadBest(){
  try { return parseInt(localStorage.getItem('snake_best')||'0',10)||0; } catch(e){ return 0; }
}
function saveBest(){
  try { localStorage.setItem('snake_best', String(best)); } catch(e){}
}

function reset(){
  stopLoop();
  // 初始蛇长 3，位于左侧居中，朝右
  snake = [{x:5,y:10},{x:4,y:10},{x:3,y:10}];
  dir = {x:1,y:0};
  nextDir = {x:1,y:0};
  score = 0;
  placeFood();
  running = false;
  refresh();
  paint();
}

/** 随机放置食物，避开蛇身占据的格子 */
function placeFood(){
  let p;
  do {
    p = {
      x: Math.floor(Math.random()*N),
      y: Math.floor(Math.random()*N)
    };
  } while (snake.some(function(s){ return s.x===p.x && s.y===p.y; }));
  food = p;
}

function toggle(){ running ? pause() : start(); }

function start(){
  running = true;
  refresh();
  ticker = setInterval(step, 130);   /* 越小越快 */
}

function pause(){
  running = false;
  stopLoop();
  refresh();
}

function stopLoop(){
  if (ticker){ clearInterval(ticker); ticker = null; }
}

/** 一步：移动、判定、重绘 */
function step(){
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // 撞墙
  if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N){ gameOver(); return; }
  // 撞自己（注意：尾巴这一格马上会移开，所以不算碰撞）
  for (let i=0;i<snake.length-1;i++){
    if (snake[i].x === head.x && snake[i].y === head.y){ gameOver(); return; }
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y){
    score += 10;
    if (score > best){ best = score; saveBest(); }
    placeFood();
  } else {
    snake.pop();
  }

  refresh();
  paint();
}

function gameOver(){
  running = false;
  stopLoop();
  document.getElementById('mainBtn').textContent = I18N[lang].again;
  paint();
  drawOverlay(I18N[lang].over + ' · ' + score);
}

/* ---------- 绘制 ---------- */
function paint(){
  bctx.fillStyle = '#1f2937';
  bctx.fillRect(0,0,320,320);

  // 食物：圆角方块 + 内嵌高光
  bctx.fillStyle = '#ef5350';
  roundRect(bctx, food.x*CELL+2, food.y*CELL+2, CELL-4, CELL-4, 4);
  bctx.fill();

  // 蛇身：蛇头亮一档，身体逐个略微提亮形成渐变感
  snake.forEach(function(s, i){
    const t = i / Math.max(1, snake.length-1);       /* 0=头 1=尾 */
    const g = Math.round(160 - 60*t);                /* 绿通道递减，越靠尾越深 */
    bctx.fillStyle = 'rgb(56,'+g+',80)';
    roundRect(bctx, s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2, 3);
    bctx.fill();
  });
}

/** 画结束遮罩 */
function drawOverlay(text){
  bctx.fillStyle = 'rgba(17,24,39,.72)';
  bctx.fillRect(0,0,320,320);
  bctx.fillStyle = '#ffffff';
  bctx.font = '600 20px system-ui, sans-serif';
  bctx.textAlign = 'center';
  bctx.textBaseline = 'middle';
  bctx.fillText(text, 160, 160);
}

/** 圆角矩形路径工具（Canvas 原生没有 roundRect 的兼容写法） */
function roundRect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x+r, y);
  c.arcTo(x+w, y,   x+w, y+h, r);
  c.arcTo(x+w, y+h, x,   y+h, r);
  c.arcTo(x,   y+h, x,   y,   r);
  c.arcTo(x,   y,   x+w, y,   r);
  c.closePath();
}

/* ---------- 界面 ---------- */
function refresh(){
  var L = I18N[lang];
  document.getElementById('t_title').textContent = L.title;
  document.getElementById('t_sub').textContent   = L.sub;
  document.getElementById('t_hint').innerHTML    = L.hint;
  document.getElementById('mainBtn').textContent = running ? L.pause : (snake.length>3 || score>0 ? L.resume : L.start);
  document.getElementById('vScore').textContent  = score;
  document.getElementById('vBest').textContent   = best;
}

const I18N = {
  zh:{ title:'贪吃蛇', sub:'吃得越多，长得越长',
       hint:'方向键 或 WASD 控制，手机可滑动<br>撞墙或撞到自己就结束',
       start:'开始', pause:'暂停', resume:'继续', again:'再来一局', over:'游戏结束' },
  en:{ title:'Snake', sub:'Eat, grow, survive',
       hint:'Arrow keys or swipe<br>Hit a wall or yourself and it is over',
       start:'Start', pause:'Pause', resume:'Resume', again:'Play again', over:'Game over' }
};

/* ---------- 输入 ---------- */
document.addEventListener('keydown', function(e){
  const k = e.key;
  let nd = null;
  if ((k==='ArrowLeft'  || k==='a' || k==='A') && dir.x !== 1)  nd = {x:-1,y:0};
  if ((k==='ArrowRight' || k==='d' || k==='D') && dir.x !== -1) nd = {x:1,y:0};
  if ((k==='ArrowUp'    || k==='w' || k==='W') && dir.y !== 1)  nd = {x:0,y:-1};
  if ((k==='ArrowDown'  || k==='s' || k==='S') && dir.y !== -1) nd = {x:0,y:1};
  // 禁止 180° 掉头：否则蛇头会直接撞上第二节身体
  if (nd){ e.preventDefault(); nextDir = nd; if(!running) start(); }
});

let sx=0, sy=0;
board.addEventListener('touchstart', function(e){
  sx=e.touches[0].clientX; sy=e.touches[0].clientY;
}, {passive:true});
board.addEventListener('touchend', function(e){
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if (Math.max(Math.abs(dx),Math.abs(dy)) < 24) return;
  let nd;
  if (Math.abs(dx) > Math.abs(dy)) nd = (dx>0 && dir.x!==-1) ? {x:1,y:0} : (dx<0 && dir.x!==1 ? {x:-1,y:0} : null);
  else                            nd = (dy>0 && dir.y!==-1) ? {x:0,y:1} : (dy<0 && dir.y!==1 ? {x:0,y:-1} : null);
  if (nd){ nextDir = nd; if(!running) start(); }
}, {passive:true});

function toggleLang(){
  lang=(lang==='zh')?'en':'zh';
  refresh();
}

best = loadBest();
reset();

/* ---------- PWA 注册 ----------
 * 注册 Service Worker 后本页被缓存，断网也能打开。
 * 放在最后且 catch 掉异常：即使浏览器不支持也不影响正常功能。 */
if ('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
